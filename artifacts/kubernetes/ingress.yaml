apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-web-app-ingress
spec:
  rules:
  - host: java-web-app.example.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: java-web-app-service
            port:
              number: 80
