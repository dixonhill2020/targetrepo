apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: legacy-app
  template:
    metadata:
      labels:
        app: legacy-app
    spec:
      containers:
      - name: legacy-app
        image: legacy-app:1.0.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: legacy-app-config
        - secretRef:
            name: legacy-app-secret
